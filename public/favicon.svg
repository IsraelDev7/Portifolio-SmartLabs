<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100" role="img" aria-label="Smart LABS">
  <title>Smart LABS</title>

  <!--
    Os Degraus, a marca da casa. A geometria e a MESMA do <PixelMonogram>:
    tres barras em x=8/38/68, subindo de 28 para 48 e 68 de altura, e a
    terceira sempre no acento — o proximo passo, ainda quente.

    ── o que muda aqui, e por que ──
    1. Sem as 96 celulas. O monograma da pagina se monta pixel a pixel,
       e isso e legivel em 24px na barra do topo. Em 16px de aba de
       navegador cada celula teria menos de um pixel: o desenho viraria
       borrao cinza. Aqui as barras sao solidas.
    2. Com fundo. Icone transparente some — barra clara desaparece numa
       aba clara, barra escura numa aba escura. O Aco solido garante que
       a marca se leia nos dois temas.
    3. Subido 8px. O desenho original ocupa de y=24 a y=92, o que o deixa
       colado embaixo quando vira quadrado. O deslocamento centra a peca
       oticamente sem tocar na geometria.
  -->

  <rect width="100" height="100" rx="16" fill="#0A0A0A"/>

  <g transform="translate(0 -8)">
    <rect x="8"  y="64" width="24" height="28" fill="#F5F0E8"/>
    <rect x="38" y="44" width="24" height="48" fill="#F5F0E8"/>
    <rect x="68" y="24" width="24" height="68" fill="#D14D29"/>
  </g>
</svg>
